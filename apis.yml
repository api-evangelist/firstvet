aid: firstvet
name: FirstVet
description: 'FirstVet is a digital veterinary care company offering 24/7 online video
  consultations with licensed veterinarians for dogs, cats, and other pets. Founded in
  Sweden, FirstVet operates a consumer telehealth platform across Sweden, Norway, Denmark,
  Finland, Germany, the United Kingdom, and the United States, providing virtual vet
  appointments, healthy pet checkups, follow-up care, and triage guidance on whether a
  case needs an in-clinic referral. The company partners with pet insurers and employers
  to offer covered or subsidized access to its subscription-based virtual care. FirstVet
  is a portfolio company of Creandum. This profile is maintained in the API Evangelist
  network; FirstVet publishes no public developer API, SDKs, or API documentation as of
  this enrichment pass.'
